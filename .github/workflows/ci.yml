name: CI
on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - run: ./mvnw clean install
      - uses: actions/upload-artifact@v4
        with:
          name: shopizer-backend
          path: sm-shop/target/shopizer.jar
